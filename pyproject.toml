[project]
name = "cityu-jobs"
version = "0.1.0"
description = "Self-hosted recommender for CityU student jobs (Campus Internship Scheme, Student Helper, ITC STEM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "httpx>=0.28",
    "jinja2>=3.1.6",
    "openpyxl>=3.1",
    "playwright>=1.50",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
eval = [
    "numpy>=2",
]
# Optional cross-encoder reranker (core/rerank.py, eval/rerank_scores.py): ~3 GB of
# packages plus a 2.3 GB model. The app and the eval work without it.
rerank = [
    "sentence-transformers>=5",
    "torch>=2.9",
]

# torch for the `rerank` group: on Linux the CUDA 12.6 build from PyTorch's own index
# (other systems get the default PyPI build). `explicit` = only torch comes from there.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
# Lets tests/eval import the repo-level `eval/` package (it isn't installed).
pythonpath = ["."]
