[project]
name = "cityu-jobs"
version = "0.1.0"
description = "Self-hosted recommender for CityU student jobs (Campus Internship Scheme, Student Helper, ITC STEM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "httpx>=0.28",
    "jinja2>=3.1.6",
    "openpyxl>=3.1",
    "playwright>=1.50",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
